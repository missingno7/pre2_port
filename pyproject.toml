[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pre2-source-port"
version = "0.2.5"
description = "Prehistorik 2 source-port workbench on top of a reusable DOS real-mode VM"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pre2-play = "pre2.cli:main"

[tool.pytest.ini_options]
# "." for pre2/, "dos_re" for the framework submodule (dos_re/ here is the
# submodule's own repo root, not the package itself — that's dos_re/dos_re/).
pythonpath = [".", "dos_re"]

[project.optional-dependencies]
viewer = [
    "numpy>=1.23",
    "pygame>=2.5",
]
test = [
    "pytest>=8",
    "pytest-xdist>=3",  # parallel suites: python -m pytest tests -q -n auto
]
adlib = [
    "cffi>=1.15",
]

[tool.setuptools.packages.find]
# dos_re is an external submodule now (its own package, installed separately
# via `pip install -e dos_re/`), not part of this project's own sources.
include = ["pre2*"]
